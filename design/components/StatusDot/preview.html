<!-- @dsCard group="Status" height=72 subtitle="Verdicts, then run marks" -->
<div class="oq-row" style="--gap: var(--space-5); padding: var(--space-4)">
  <span class="oq-status" data-verdict="pass">pass</span>
  <span class="oq-status" data-verdict="warn">warn</span>
  <span class="oq-status" data-verdict="fail">fail</span>
  <span class="oq-status" data-verdict="skipped">skipped</span>
  <span class="oq-status" data-verdict="running">running</span>
  <span class="oq-status" data-run="queued">queued</span>
  <span class="oq-status" data-run="waiting">waiting on you</span>
</div>
