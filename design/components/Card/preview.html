<!-- @dsCard group="Layout" height=260 subtitle="Run card and settings card" -->
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-4); padding: var(--space-4); align-items: start">
  <a class="oq-card" href="#run">
    <div class="oq-card__header">
      <h3 class="oq-card__title">Adopt a run whose execution ended</h3>
      <span class="oq-badge oq-badge--solid" data-intent="success">Pass</span>
    </div>
    <div class="oq-card__body oq-stack" style="--gap: var(--space-1)">
      <span class="oq-mono oq-muted" style="font-size: var(--font-size-sm)">jyothepro/windkeel · #261</span>
      <span class="oq-card__meta">5 stages · 4m 12s · codex-worker</span>
    </div>
  </a>
  <div class="oq-card">
    <div class="oq-card__header"><h3 class="oq-card__title">Verification</h3></div>
    <div class="oq-card__body oq-stack" style="--gap: var(--space-4)">
      <div class="oq-switch-row">
        <div class="oq-switch-row__text"><span class="oq-switch-row__title" id="cs1">Adversarial review</span><span class="oq-switch-row__desc">A second model argues against the change.</span></div>
        <button type="button" class="oq-switch" role="switch" aria-checked="true" aria-labelledby="cs1"></button>
      </div>
    </div>
    <div class="oq-card__footer"><button type="button" class="oq-button">Reset</button><button type="button" class="oq-button oq-button--primary">Save</button></div>
  </div>
</div>
