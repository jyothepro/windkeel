<!-- @dsCard group="Status" height=120 subtitle="Every intent, subtle and solid" -->
<div class="oq-stack" style="--gap: var(--space-3); padding: var(--space-4)">
  <div class="oq-row">
    <span class="oq-badge">draft</span>
    <span class="oq-badge" data-intent="accent">you</span>
    <span class="oq-badge" data-intent="agent">agent working</span>
    <span class="oq-badge" data-intent="success">2 passed</span>
    <span class="oq-badge" data-intent="warning">1 warn</span>
    <span class="oq-badge" data-intent="danger">3 findings</span>
    <span class="oq-badge" data-intent="info">
      <svg class="oq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.5 8-8 9-4.5-1-8-4.5-8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
      Sigstore sealed
    </span>
  </div>
  <div class="oq-row">
    <span class="oq-badge oq-badge--solid" data-intent="success">Pass</span>
    <span class="oq-badge oq-badge--solid" data-intent="danger">Fail</span>
    <span class="oq-badge oq-badge--solid" data-intent="warning">Warn</span>
    <span class="oq-badge oq-badge--solid" data-intent="agent">Running</span>
    <span class="oq-badge oq-badge--solid">v0.2.0</span>
    <span class="oq-badge oq-badge--sm" data-intent="accent">12</span>
  </div>
</div>
