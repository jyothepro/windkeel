<!-- @dsCard group="Feedback" height=300 subtitle="Destructive confirmation, shown in place" -->
<div class="oq-dialog-scrim" style="min-height: 300px">
  <div class="oq-dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <div class="oq-dialog__header"><h2 class="oq-dialog__title" id="dlg-title">Stop this run?</h2></div>
    <div class="oq-dialog__body">The agent stops after its current step. Work so far stays on <code>claude/late-merge</code>, and the run is recorded as cancelled.</div>
    <div class="oq-dialog__footer">
      <button type="button" class="oq-button">Keep running</button>
      <button type="button" class="oq-button oq-button--danger">Stop run</button>
    </div>
  </div>
</div>
