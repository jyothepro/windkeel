<!-- @dsCard group="Actions" height=150 subtitle="Default, primary, ghost, danger; three sizes; icon and busy states" -->
<div class="oq-stack" style="--gap: var(--space-4); padding: var(--space-4)">
  <div class="oq-row">
    <button type="button" class="oq-button oq-button--primary">
      <svg class="oq-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V9a3 3 0 0 0-3-3h-4M13 3.5 10.5 6 13 8.5"/></svg>
      Open pull request
    </button>
    <button type="button" class="oq-button">View diff</button>
    <button type="button" class="oq-button oq-button--ghost">Copy link</button>
    <button type="button" class="oq-button oq-button--danger">
      <svg class="oq-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      Stop run
    </button>
  </div>
  <div class="oq-row">
    <button type="button" class="oq-button oq-button--primary oq-button--sm">Send <span class="oq-button__hint">⌘↵</span></button>
    <button type="button" class="oq-button oq-button--sm">Retry stage</button>
    <button type="button" class="oq-button oq-button--primary oq-button--lg">Start a run</button>
    <button type="button" class="oq-button oq-button--icon" aria-label="Search runs">
      <svg class="oq-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
    </button>
    <button type="button" class="oq-button" aria-busy="true"><span class="oq-spinner" aria-hidden="true"></span>Verifying</button>
    <button type="button" class="oq-button oq-button--primary" disabled>Merge</button>
  </div>
</div>
