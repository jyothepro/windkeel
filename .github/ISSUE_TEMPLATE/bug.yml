name: Bug report
description: Something in the CLI, the GitHub Action or the factory does not work as documented.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest command, workflow file or repository that shows it.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `windkeel --version`, or the commit you pinned the Action to.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - CLI, locally
        - GitHub Action
        - Managed service
        - Self-hosted factory
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens and keys before pasting.
      render: text
