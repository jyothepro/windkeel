# ADR-0016 §4: `docker compose up` starts Postgres and MinIO — the local substitutes for
# Supabase Postgres and Supabase Storage (ADR-0008). Postgres matches Supabase's major
# version so migrations run identically here; MinIO is S3-compatible, satisfying the same
# S3-protocol storage seam with only an endpoint and credentials changed. The `migrate`
# service applies migrations/*.sql via the same runner (`npm run db:migrate`,
# src/factory/migrate-cli.ts) production uses, so a fresh clone reaches a working schema
# in one command with no second implementation of migration logic.

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: windkeel
      POSTGRES_PASSWORD: windkeel
      POSTGRES_DB: windkeel
    ports:
      - "5432:5432"
    volumes:
      - windkeel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U windkeel -d windkeel"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: windkeel
      MINIO_ROOT_PASSWORD: windkeel-local-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - windkeel-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Creates the evidence bucket once MinIO is up, then exits. Not "a second implementation
  # of factory logic" (ADR-0016 §5) — it only provisions the bucket the real code writes to.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 windkeel windkeel-local-dev &&
      mc mb --ignore-existing local/evidence
      "

  migrate:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://windkeel:windkeel@postgres:5432/windkeel
    command: sh -c "npm ci --ignore-scripts && npm run db:migrate"

volumes:
  windkeel-postgres:
  windkeel-minio:
